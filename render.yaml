# Render.com blueprint: New -> Blueprint -> select this repository.
# API keys are entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: prospect-discovery-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini          # free tier; set to "anthropic" + ANTHROPIC_API_KEY for production
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
